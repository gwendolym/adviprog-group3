repos:
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend lint
        entry: sh -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-commit]

      - id: frontend-test
        name: Frontend tests
        entry: sh -c 'cd frontend && npm run test'
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-commit]

      - id: backend-lint
        name: Backend lint
        entry: sh -c 'cd backend && npm run lint'
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-commit]

      - id: backend-test
        name: Backend tests
        entry: sh -c 'cd backend && npm run test'
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-commit]
